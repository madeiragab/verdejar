name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verdejar
          POSTGRES_PASSWORD: verdejar
          POSTGRES_DB: verdejar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verdejar" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://verdejar:verdejar@localhost:5432/verdejar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations e seed num Postgres limpo
        run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
