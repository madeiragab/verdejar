# Blueprint do Render (plano gratuito): um serviço só, que entrega a API e o site.
# Banco: PostgreSQL gratuito do Neon — cole a URL em DATABASE_URL ao criar o Blueprint.
# Guia completo: docs/06-deploy-gratuito.md
services:
  - type: web
    name: verdejar
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && npm ci && npx prisma migrate deploy && npm run build && npm run db:seed
    startCommand: cd backend && NODE_ENV=production npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # Site público: sem as contas de exemplo do README (senhas conhecidas)
      - key: SEED_DEMO_ACCOUNTS
        value: 'false'
