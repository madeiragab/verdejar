# Blueprint do Render (plano gratuito) para o backend.
# Banco: crie um Postgres gratuito no Neon e coloque a URL em DATABASE_URL.
services:
  - type: web
    name: verdejar-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
